<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray Config Generator</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-main: #333333;
            --accent: #0066cc;
            --accent-hover: #004c99;
            --border: #cccccc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            background: var(--container-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea {
            resize: vertical;
        }
        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 1rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .help-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VLESS to Xray Config (Windows)</h1>
    
    <label for="vlessUrl">VLESS Share Link</label>
    <textarea id="vlessUrl" rows="4" placeholder="vless://UUID@hostname:port?encryption=none&..."></textarea>
    <div class="help-text">Paste your standard VLESS URI here.</div>

    <label for="directDomains">Direct Routed Domains</label>
    <textarea id="directDomains" rows="3" placeholder="example.com, mycompany.net"></textarea>
    <div class="help-text">Comma or newline-separated domains to bypass the proxy.</div>

    <button onclick="generateConfig()">Download config.json</button>
</div>

<script>
    // The provided template with securely configured DoH and routing defaults
    const template = {
      "log": { "loglevel": "warning" },
      "dns": {
        "hosts": {
          "dns.google": ["8.8.8.8", "8.8.4.4", "2001:4860:4860::8888", "2001:4860:4860::8844"],
          "dns.alidns.com": ["223.5.5.5", "223.6.6.6", "2400:3200::1", "2400:3200:baba::1"],
          "one.one.one.one": ["1.1.1.1", "1.0.0.1", "2606:4700:4700::1111", "2606:4700:4700::1001"],
          "1dot1dot1dot1.cloudflare-dns.com": ["1.1.1.1", "1.0.0.1", "2606:4700:4700::1111", "2606:4700:4700::1001"],
          "cloudflare-dns.com": ["104.16.249.249", "104.16.248.249", "2606:4700::6810:f8f9", "2606:4700::6810:f9f9"],
          "dns.cloudflare.com": ["162.159.61.8", "172.64.41.8", "2a06:98c1:52::8", "2803:f800:53::8"],
          "dot.pub": ["1.12.12.12", "120.53.53.53"],
          "doh.pub": ["1.12.12.12", "120.53.53.53"],
          "dns.quad9.net": ["9.9.9.9", "149.112.112.112", "2620:fe::fe", "2620:fe::9"],
          "dns.yandex.net": ["77.88.8.8", "77.88.8.1", "2a02:6b8::feed:0ff", "2a02:6b8:0:1::feed:0ff"],
          "dns.sb": ["45.11.45.11", "185.222.222.222", "2a09::", "2a11::"],
          "dns.umbrella.com": ["208.67.220.220", "208.67.222.222", "2620:119:35::35", "2620:119:53::53"],
          "dns.sse.cisco.com": ["208.67.220.220", "208.67.222.222", "2620:119:35::35", "2620:119:53::53"],
          "engage.cloudflareclient.com": ["162.159.192.1", "2606:4700:d0::a29f:c001"]
        },
        "servers": [
          { "address": "119.29.29.29", "domains": ["geosite:private"], "skipFallback": true, "tag": "direct-dns-1" },
          { "address": "119.29.29.29", "domains": ["full:cloudflare-dns.com"], "skipFallback": true },
          "https://cloudflare-dns.com/dns-query"
        ],
        "tag": "dns-module"
      },
      "inbounds": [
        {
          "tag": "socks",
          "port": 10808,
          "listen": "127.0.0.1",
          "protocol": "mixed",
          "sniffing": {
            "enabled": true,
            "destOverride": ["http", "tls"],
            "routeOnly": false
          },
          "settings": { "auth": "noauth", "udp": true, "allowTransparent": false }
        }
      ],
      "outbounds": [
        {
          "tag": "proxy",
          "protocol": "vless",
          "settings": {
            "vnext": [
              {
                "address": "",
                "port": 443,
                "users": [
                  {
                    "id": "",
                    "email": "t@t.tt",
                    "security": "auto",
                    "encryption": "none",
                    "flow": ""
                  }
                ]
              }
            ]
          },
          "streamSettings": {
            "network": "raw",
            "security": "reality",
            "realitySettings": {
              "serverName": "",
              "fingerprint": "chrome",
              "show": false,
              "publicKey": "",
              "shortId": "",
              "spiderX": "/",
              "mldsa65Verify": ""
            }
          },
          "mux": { "enabled": false, "concurrency": -1 }
        },
        { "tag": "direct", "protocol": "freedom" },
        { "tag": "block", "protocol": "blackhole" }
      ],
      "routing": {
        "domainStrategy": "AsIs",
        "rules": [
          { "type": "field", "port": "443", "network": "udp", "outboundTag": "block" },
          { "type": "field", "outboundTag": "direct", "ip": ["geoip:private"] },
          { "type": "field", "outboundTag": "direct", "domain": ["geosite:private"] },
          // Placeholder for dynamic direct domains inserted via user input
          { "type": "field", "port": "0-65535", "outboundTag": "proxy" },
          { "type": "field", "inboundTag": ["direct-dns-1"], "outboundTag": "direct" },
          { "type": "field", "inboundTag": ["dns-module"], "outboundTag": "proxy" }
        ]
      }
    };

    function generateConfig() {
        const vlessInput = document.getElementById('vlessUrl').value.trim();
        const domainsInput = document.getElementById('directDomains').value;
        
        if (!vlessInput || !vlessInput.startsWith('vless://')) {
            alert('Please enter a valid vless:// URI.');
            return;
        }

        try {
            // Deep clone the template
            const config = JSON.parse(JSON.stringify(template));
            
            // Parse VLESS URI
            // Example format: vless://UUID@hostname:port?type=tcp&security=reality&pbk=KEY&sni=SNI...
            const urlObj = new URL(vlessInput);
            const params = new URLSearchParams(urlObj.search);
            
            // Extract core node info
            const uuid = urlObj.username;
            const address = urlObj.hostname;
            const port = parseInt(urlObj.port) || 443;
            
            // Extract specific query parameters
            const flow = params.get('flow') || '';
            const encryption = params.get('encryption') || 'none';
            const network = params.get('type') || 'raw';
            const security = params.get('security') || 'reality';
            const sni = params.get('sni') || '';
            const fp = params.get('fp') || 'chrome';
            const pbk = params.get('pbk') || '';
            const sid = params.get('sid') || '';
            const spx = params.get('spx') || params.get('spiderX') || '/';

            // Map to config outbound
            const outbound = config.outbounds[0];
            const vnext = outbound.settings.vnext[0];
            
            vnext.address = address;
            vnext.port = port;
            vnext.users[0].id = uuid;
            vnext.users[0].encryption = encryption;
            vnext.users[0].flow = flow;

            outbound.streamSettings.network = network;
            outbound.streamSettings.security = security;
            
            if (security === 'reality') {
                outbound.streamSettings.realitySettings = {
                    serverName: sni,
                    fingerprint: fp,
                    show: false,
                    publicKey: pbk,
                    shortId: sid,
                    spiderX: spx,
                    mldsa65Verify: ""
                };
            } else {
                delete outbound.streamSettings.realitySettings;
            }

            // Handle custom direct domains
            if (domainsInput.trim()) {
                const domainList = domainsInput
                    .split(/[\n,]+/)
                    .map(d => d.trim())
                    .filter(d => d.length > 0);
                
                if (domainList.length > 0) {
                    const customRule = {
                        "type": "field",
                        "outboundTag": "direct",
                        "domain": domainList
                    };
                    // Insert right before the global 0-65535 proxy rule
                    const proxyRuleIndex = config.routing.rules.findIndex(r => r.port === "0-65535" && r.outboundTag === "proxy");
                    if (proxyRuleIndex > -1) {
                        config.routing.rules.splice(proxyRuleIndex, 0, customRule);
                    } else {
                        config.routing.rules.unshift(customRule);
                    }
                }
            }

            // Export logic
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);

        } catch (e) {
            alert('Failed to parse the URI. Ensure it follows standard VLESS share link formatting.');
            console.error(e);
        }
    }
</script>

</body>
</html>
